[project]
name = "llm-provider-adapters"
version = "0.1.0"
description = "AI sprint project"
requires-python = ">=3.12"
dependencies = [
    "httpx2>=2.12",
    "openai>=3.11",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "rich>=13",
    "typer>=0.12",
]

[project.scripts]
llm-provider-adapters = "llm_provider_adapters.cli:app"

[dependency-groups]
dev = [
    "mypy",
    "pre-commit",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_provider_adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: calls a real model provider (run with: pytest --integration)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.uv]
# Resolve only releases that existed at project setup so the lock stays reproducible.
exclude-newer = "2026-09-10T13:42:00Z"
